name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Re-scan weekly so newly published queries reach existing code, not just
    # code that happens to change.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required so findings land in the repository's Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          # security-extended adds lower-severity and precision queries beyond
          # the default set; worth the extra runtime for a credential store.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
